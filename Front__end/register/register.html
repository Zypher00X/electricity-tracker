<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PowerTrack | สมัครสมาชิก</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="/frontend/register/register.css"
  >

  <!-- JavaScript -->
  <script
    src="/frontend/register/register.js"
    defer
  ></script>

</head>

<body>

  <!-- ============================= -->
  <!-- PAGE TITLE -->
  <!-- ============================= -->

  <header class="page-header">

    <div class="page-number">
      2
    </div>

    <div>
      หน้าสมัครสมาชิก (Register)
    </div>

  </header>


  <!-- ============================= -->
  <!-- REGISTER PAGE -->
  <!-- ============================= -->

  <main class="page-container">

    <section class="register-card">


      <!-- ========================= -->
      <!-- LEFT PANEL -->
      <!-- ========================= -->

      <div class="left-panel">

        <div class="brand">

          <div class="brand-icon">
            ⚡
          </div>

          <h1>
            PowerTrack
          </h1>

          <p>
            บันทึก วิเคราะห์ และติดตามการใช้ไฟฟ้า
          </p>

        </div>


        <!-- Illustration -->

        <div class="illustration">

          <svg
            viewBox="0 0 500 420"
            xmlns="http://www.w3.org/2000/svg"
          >

            <!-- White Circle -->

            <circle
              cx="335"
              cy="105"
              r="70"
              fill="#ffffff"
              opacity="0.9"
            />


            <!-- Light Bulb -->

            <circle
              cx="335"
              cy="103"
              r="31"
              fill="#ffd76a"
            />

            <circle
              cx="335"
              cy="103"
              r="18"
              fill="#ffeba3"
            />

            <path
              d="M323 125 H347 L343 145 H327 Z"
              fill="#7d9bb7"
            />

            <rect
              x="326"
              y="144"
              width="18"
              height="8"
              rx="3"
              fill="#597894"
            />

            <path
              d="M335 72 V58"
              stroke="#ffc944"
              stroke-width="5"
              stroke-linecap="round"
            />

            <path
              d="M304 77 L294 67"
              stroke="#ffc944"
              stroke-width="5"
              stroke-linecap="round"
            />

            <path
              d="M366 77 L376 67"
              stroke="#ffc944"
              stroke-width="5"
              stroke-linecap="round"
            />


            <!-- Cloud -->

            <path
              d="
                M45 125
                C46 108 62 98 78 102
                C86 83 116 85 123 107
                C140 106 150 118 147 131
                H45
                Z
              "
              fill="#ffffff"
              opacity="0.75"
            />


            <!-- Ground -->

            <ellipse
              cx="250"
              cy="347"
              rx="185"
              ry="38"
              fill="#6ac799"
            />


            <!-- Left Plants -->

            <ellipse
              cx="86"
              cy="287"
              rx="27"
              ry="62"
              transform="rotate(-30 86 287)"
              fill="#159b83"
            />

            <ellipse
              cx="119"
              cy="279"
              rx="25"
              ry="69"
              transform="rotate(17 119 279)"
              fill="#2eb891"
            />

            <ellipse
              cx="148"
              cy="299"
              rx="20"
              ry="55"
              transform="rotate(33 148 299)"
              fill="#117d70"
            />


            <!-- Right Plants -->

            <ellipse
              cx="411"
              cy="292"
              rx="27"
              ry="62"
              transform="rotate(31 411 292)"
              fill="#159b83"
            />

            <ellipse
              cx="382"
              cy="290"
              rx="22"
              ry="60"
              transform="rotate(-15 382 290)"
              fill="#35b894"
            />


            <!-- House -->

            <rect
              x="158"
              y="205"
              width="166"
              height="132"
              rx="5"
              fill="#edf8ff"
            />

            <polygon
              points="138,215 242,140 346,215"
              fill="#07569e"
            />

            <polygon
              points="153,213 242,152 331,213"
              fill="#1175c7"
            />


            <!-- Window 1 -->

            <rect
              x="178"
              y="228"
              width="48"
              height="48"
              rx="3"
              fill="#2e91df"
            />

            <line
              x1="202"
              y1="228"
              x2="202"
              y2="276"
              stroke="#ffffff"
              stroke-width="4"
            />

            <line
              x1="178"
              y1="252"
              x2="226"
              y2="252"
              stroke="#ffffff"
              stroke-width="4"
            />


            <!-- Window 2 -->

            <rect
              x="178"
              y="287"
              width="48"
              height="48"
              rx="3"
              fill="#2e91df"
            />

            <line
              x1="202"
              y1="287"
              x2="202"
              y2="335"
              stroke="#ffffff"
              stroke-width="4"
            />

            <line
              x1="178"
              y1="311"
              x2="226"
              y2="311"
              stroke="#ffffff"
              stroke-width="4"
            />


            <!-- Meter -->

            <rect
              x="262"
              y="244"
              width="116"
              height="101"
              rx="16"
              fill="#365a8c"
            />

            <rect
              x="274"
              y="256"
              width="92"
              height="77"
              rx="10"
              fill="#f8fcff"
            />

            <rect
              x="292"
              y="270"
              width="56"
              height="25"
              rx="4"
              fill="#eaf5ff"
            />

            <text
              x="320"
              y="288"
              text-anchor="middle"
              font-size="13"
              font-weight="700"
              fill="#577089"
            >
              มิเตอร์
            </text>

            <text
              x="320"
              y="319"
              text-anchor="middle"
              font-size="20"
              font-weight="800"
              fill="#254e7d"
            >
              kWh
            </text>

          </svg>

        </div>

      </div>


      <!-- ========================= -->
      <!-- RIGHT PANEL -->
      <!-- ========================= -->

      <div class="right-panel">

        <div class="register-content">

          <h2>
            สมัครสมาชิก
          </h2>

          <p class="register-subtitle">
            สร้างบัญชีเพื่อเริ่มใช้งาน
          </p>


          <form id="registerForm">

            <!-- Full Name -->

            <div class="form-group">

              <label for="fullname">
                ชื่อ - นามสกุล
              </label>

              <div class="input-wrapper">

                <span class="input-icon">

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <circle
                      cx="12"
                      cy="7"
                      r="4"
                    />

                    <path
                      d="M5.5 21a6.5 6.5 0 0 1 13 0"
                    />
                  </svg>

                </span>

                <input
                  type="text"
                  id="fullname"
                  name="fullname"
                  placeholder="กรอกชื่อ - นามสกุล"
                  autocomplete="name"
                  required
                />

              </div>

            </div>


            <!-- Email -->

            <div class="form-group">

              <label for="email">
                อีเมล
              </label>

              <div class="input-wrapper">

                <span class="input-icon">

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect
                      x="3"
                      y="5"
                      width="18"
                      height="14"
                      rx="2"
                    />

                    <path
                      d="m3 7 9 6 9-6"
                    />
                  </svg>

                </span>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="กรอกอีเมล"
                  autocomplete="email"
                  required
                />

              </div>

            </div>


            <!-- Phone -->

            <div class="form-group">

              <label for="phone">
                เบอร์โทรศัพท์
              </label>

              <div class="input-wrapper">

                <span class="input-icon">

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="
                        M22 16.92v3
                        a2 2 0 0 1-2.18 2
                        19.79 19.79 0 0 1-8.63-3.07
                        19.5 19.5 0 0 1-6-6
                        19.79 19.79 0 0 1-3.07-8.67
                        A2 2 0 0 1 4.11 2h3
                        a2 2 0 0 1 2 1.72
                        12.84 12.84 0 0 0 .7 2.81
                        2 2 0 0 1-.45 2.11L8.09 9.91
                        a16 16 0 0 0 6 6
                        l1.27-1.27
                        a2 2 0 0 1 2.11-.45
                        12.84 12.84 0 0 0 2.81.7
                        A2 2 0 0 1 22 16.92z
                      "
                    />
                  </svg>

                </span>

                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="08x-xxx-xxxx"
                  autocomplete="tel"
                  required
                />

              </div>

            </div>


            <!-- Password -->

            <div class="form-group">

              <label for="password">
                รหัสผ่าน
              </label>

              <div class="input-wrapper">

                <span class="input-icon">

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect
                      x="5"
                      y="10"
                      width="14"
                      height="11"
                      rx="2"
                    />

                    <path
                      d="M8 10V7a4 4 0 0 1 8 0v3"
                    />
                  </svg>

                </span>

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="ตั้งรหัสผ่าน 8 ตัวอักษรขึ้นไป"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="passwordToggle"
                  aria-label="แสดงหรือซ่อนรหัสผ่าน"
                >

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                    />

                    <circle
                      cx="12"
                      cy="12"
                      r="3"
                    />

                  </svg>

                </button>

              </div>

            </div>


            <!-- Register Button -->

            <button
              type="submit"
              class="register-button"
              id="registerButton"
            >
              สมัครสมาชิก
            </button>

            <div class="divider">

              <span></span>

              <p>หรือ</p>

              <span></span>

            </div>


            <button
              type="button"
              class="google-button"
              id="googleRegisterButton"
            >

              <span class="google-icon">
                G
              </span>

              สมัครสมาชิกด้วย Google

            </button>

            <div
              id="formMessage"
              class="form-message"
              role="status"
              aria-live="polite"
            ></div>

          </form>


          <!-- Login Link -->

          <p class="login-text">

            มีบัญชีอยู่แล้ว?

            <a href="/login">
              เข้าสู่ระบบ
            </a>

          </p>

        </div>

      </div>

    </section>

  </main>

</body>

</html>
