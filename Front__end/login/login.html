<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PowerTrack | เข้าสู่ระบบ</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="/frontend/login/login.css"
  >

  <!-- JavaScript -->
  <script
    src="/frontend/login/login.js"
    defer
  ></script>

  
</head>

<body>

  <!-- ========================================
       PAGE TITLE
  ========================================= -->

  <header class="page-header">

    <div class="page-number">
      1
    </div>

    <div>
      หน้าเข้าสู่ระบบ (Login)
    </div>

  </header>


  <!-- ========================================
       LOGIN PAGE
  ========================================= -->

  <main class="page-container">

    <section class="login-card">


      <!-- =====================================
           LEFT PANEL
      ====================================== -->

      <div class="left-panel">

        <!-- Logo -->

        <div class="brand">

          <div class="brand-icon">
            ⚡
          </div>

          <h1>
            PowerTrack
          </h1>

          <p>
            บันทึก วิเคราะห์ และติดตามการใช้ไฟฟ้า
          </p>

        </div>


        <!-- Illustration -->

        <div class="illustration">

          <svg
            viewBox="0 0 500 420"
            xmlns="http://www.w3.org/2000/svg"
          >

            <!-- Background circle -->

            <circle
              cx="327"
              cy="105"
              r="70"
              fill="#ffffff"
              opacity="0.9"
            />

            <!-- Bulb -->

            <circle
              cx="327"
              cy="103"
              r="31"
              fill="#ffd86b"
            />

            <circle
              cx="327"
              cy="103"
              r="18"
              fill="#ffe99c"
            />

            <path
              d="M315 125 H339 L335 145 H319 Z"
              fill="#7d9bb7"
            />

            <rect
              x="318"
              y="144"
              width="18"
              height="8"
              rx="3"
              fill="#597894"
            />

            <path
              d="M327 72 V58"
              stroke="#ffc945"
              stroke-width="5"
              stroke-linecap="round"
            />

            <path
              d="M296 77 L286 67"
              stroke="#ffc945"
              stroke-width="5"
              stroke-linecap="round"
            />

            <path
              d="M358 77 L368 67"
              stroke="#ffc945"
              stroke-width="5"
              stroke-linecap="round"
            />


            <!-- Ground -->

            <ellipse
              cx="250"
              cy="345"
              rx="185"
              ry="39"
              fill="#6ac699"
            />


            <!-- Plants left -->

            <ellipse
              cx="88"
              cy="280"
              rx="28"
              ry="64"
              transform="rotate(-30 88 280)"
              fill="#159b83"
            />

            <ellipse
              cx="119"
              cy="274"
              rx="25"
              ry="70"
              transform="rotate(17 119 274)"
              fill="#2eb891"
            />

            <ellipse
              cx="146"
              cy="297"
              rx="20"
              ry="55"
              transform="rotate(33 146 297)"
              fill="#117d70"
            />


            <!-- Plants right -->

            <ellipse
              cx="408"
              cy="287"
              rx="27"
              ry="63"
              transform="rotate(31 408 287)"
              fill="#159b83"
            />

            <ellipse
              cx="379"
              cy="286"
              rx="22"
              ry="60"
              transform="rotate(-15 379 286)"
              fill="#35b894"
            />


            <!-- House -->

            <rect
              x="160"
              y="206"
              width="164"
              height="129"
              rx="5"
              fill="#edf8ff"
            />

            <polygon
              points="141,216 242,142 344,216"
              fill="#07569e"
            />

            <polygon
              points="155,214 242,153 329,214"
              fill="#1175c7"
            />

            <rect
              x="181"
              y="230"
              width="48"
              height="48"
              rx="3"
              fill="#2e91df"
            />

            <line
              x1="205"
              y1="230"
              x2="205"
              y2="278"
              stroke="#ffffff"
              stroke-width="4"
            />

            <line
              x1="181"
              y1="254"
              x2="229"
              y2="254"
              stroke="#ffffff"
              stroke-width="4"
            />


            <!-- Door -->

            <rect
              x="250"
              y="256"
              width="43"
              height="79"
              rx="4"
              fill="#0d609f"
            />


            <!-- Electric Meter -->

            <rect
              x="263"
              y="245"
              width="115"
              height="100"
              rx="16"
              fill="#365a8c"
            />

            <rect
              x="275"
              y="257"
              width="91"
              height="76"
              rx="10"
              fill="#f8fcff"
            />

            <rect
              x="293"
              y="271"
              width="55"
              height="25"
              rx="4"
              fill="#eaf5ff"
            />

            <text
              x="321"
              y="289"
              text-anchor="middle"
              font-size="14"
              font-weight="700"
              fill="#577089"
            >
              มิเตอร์
            </text>

            <text
              x="321"
              y="319"
              text-anchor="middle"
              font-size="20"
              font-weight="800"
              fill="#254e7d"
            >
              kWh
            </text>


            <!-- Small cloud -->

            <path
              d="
                M47 126
                C48 108 64 98 80 102
                C88 82 119 84 125 107
                C143 106 151 119 148 132
                H47
                Z
              "
              fill="#ffffff"
              opacity="0.72"
            />

          </svg>

        </div>


        <div class="left-slogan">

          รู้ค่าไฟ&nbsp;&nbsp;
          รู้แนวโน้ม&nbsp;&nbsp;
          ประหยัดได้จริง

        </div>

      </div>


      <!-- =====================================
           RIGHT PANEL
      ====================================== -->

      <div class="right-panel">

        <div class="login-content">

          <h2>
            เข้าสู่ระบบ
          </h2>

          <p class="login-subtitle">
            กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ
          </p>


          <!-- Login Form -->

          <form
            id="loginForm"
            action="#"
            method="post"
          >

            <!-- Username -->

            <div class="form-group">

              <div class="input-wrapper">

                <span class="input-icon">

                  <svg
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="
                        M12 12c2.761 0 5-2.239 5-5
                        s-2.239-5-5-5-5 2.239-5 5
                        2.239 5 5 5zm0 2
                        c-4.418 0-8 2.239-8 5v2h16v-2
                        c0-2.761-3.582-5-8-5z
                      "
                    />
                  </svg>

                </span>

                <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="อีเมลหรือเบอร์โทรศัพท์"
                  autocomplete="username"
                  required
                />

              </div>

            </div>


            <!-- Password -->

            <div class="form-group">

              <div class="input-wrapper">

                <span class="input-icon">

                  <svg
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="
                        M17 8h-1V6
                        c0-2.21-1.79-4-4-4
                        S8 3.79 8 6v2H7
                        c-1.1 0-2 .9-2 2v10
                        c0 1.1.9 2 2 2h10
                        c1.1 0 2-.9 2-2V10
                        c0-1.1-.9-2-2-2zm-5 9
                        c-1.1 0-2-.9-2-2
                        s.9-2 2-2 2 .9 2 2
                        -.9 2-2 2zm2.1-9H9.9V6
                        c0-1.16.94-2.1 2.1-2.1
                        1.16 0 2.1.94 2.1 2.1v2z
                      "
                    />
                  </svg>

                </span>

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="รหัสผ่าน"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="passwordToggle"
                  aria-label="แสดงหรือซ่อนรหัสผ่าน"
                >

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="
                        M1 12
                        s4-7 11-7
                        11 7 11 7
                        -4 7-11 7
                        S1 12 1 12z
                      "
                    />

                    <circle
                      cx="12"
                      cy="12"
                      r="3"
                    />

                  </svg>

                </button>

              </div>

            </div>


            <!-- Remember + Forgot -->

            <div class="form-options">

              <label class="remember-me">

                <input
                  type="checkbox"
                  name="remember"
                  id="rememberMe"
                />

                <span>
                  จดจำฉันไว้ในระบบ
                </span>

              </label>

              <a
                href="#"
                class="forgot-password"
              >
                ลืมรหัสผ่าน?
              </a>

            </div>


            <!-- Login -->

            <button
              type="submit"
              class="login-button"
              id="loginButton"
            >
              เข้าสู่ระบบ
            </button>


            <!-- Success / Error message -->

            <div
              id="formMessage"
              class="form-message"
              role="status"
              aria-live="polite"
            ></div>

          </form>


          <!-- Divider -->

          <div class="divider">
            หรือ
          </div>


          <!-- Google Login -->

          <button
            type="button"
            class="google-button"
            id="googleLoginButton"
          >

            <svg
              class="google-logo"
              viewBox="0 0 48 48"
            >
              <path
                fill="#FFC107"
                d="
                  M43.6 20.5H42V20H24v8h11.3
                  C33.7 32.7 29.2 36 24 36
                  c-6.6 0-12-5.4-12-12
                  s5.4-12 12-12
                  c3.1 0 5.9 1.2 8 3.1
                  l5.7-5.7C34.1 6.1 29.3 4 24 4
                  12.9 4 4 12.9 4 24
                  s8.9 20 20 20
                  20-8.9 20-20
                  c0-1.3-.1-2.4-.4-3.5z
                "
              />

              <path
                fill="#FF3D00"
                d="
                  M6.3 14.7l6.6 4.8
                  C14.7 15.1 19 12 24 12
                  c3.1 0 5.9 1.2 8 3.1
                  l5.7-5.7
                  C34.1 6.1 29.3 4 24 4
                  c-7.7 0-14.4 4.3-17.7 10.7z
                "
              />

              <path
                fill="#4CAF50"
                d="
                  M24 44
                  c5.1 0 9.7-2 13.2-5.2
                  l-6.1-5.2
                  C29.1 35.1 26.7 36 24 36
                  c-5.2 0-9.7-3.3-11.3-7.9
                  l-6.5 5
                  C9.5 39.5 16.2 44 24 44z
                "
              />

              <path
                fill="#1976D2"
                d="
                  M43.6 20.5H42V20H24v8h11.3
                  c-.8 2.4-2.3 4.3-4.2 5.6
                  l6.1 5.2
                  C36.8 39.2 44 34 44 24
                  c0-1.3-.1-2.4-.4-3.5z
                "
              />
            </svg>

            <span>
              เข้าสู่ระบบด้วย Google
            </span>

          </button>


          <!-- Register -->

          <p class="register-text">

            ยังไม่มีบัญชี?

            <a href="/register">
              สมัครสมาชิก
            </a>

          </p>

        </div>

      </div>

    </section>

  </main>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

</body>
</html>
