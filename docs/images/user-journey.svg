<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">PowerTrack user journey</title><desc id="desc">Five steps: household settings, monthly bill, appliance usage, charts, and AI advice.</desc><rect width="1200" height="270" rx="22" fill="#edf5ff"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="21" fill="#103c73" font-weight="bold">FROM YOUR DATA TO AN ACTION PLAN</text><rect x="30" y="70" width="200" height="164" rx="15" fill="white" stroke="#ccdef7"/><circle cx="59" cy="101" r="16" fill="#1479ef"/><text x="54" y="107" fill="white" font-size="17">1</text><text x="47" y="143" font-weight="bold" font-size="17" fill="#123e73">SETTINGS</text><text x="47" y="176" font-size="15" fill="#547294">Home + people</text><text x="47" y="202" font-size="15" fill="#547294">Prices + budget</text><path d="M237 151h19m-7-7 7 7-7 7" fill="none" stroke="#4394f2" stroke-width="3"/><rect x="265" y="70" width="200" height="164" rx="15" fill="white" stroke="#ccdef7"/><circle cx="294" cy="101" r="16" fill="#1479ef"/><text x="289" y="107" fill="white" font-size="17">2</text><text x="282" y="143" font-weight="bold" font-size="17" fill="#123e73">MONTHLY BILL</text><text x="282" y="176" font-size="15" fill="#547294">Meter readings</text><text x="282" y="202" font-size="15" fill="#547294">Units + total cost</text><path d="M472 151h19m-7-7 7 7-7 7" fill="none" stroke="#4394f2" stroke-width="3"/><rect x="500" y="70" width="200" height="164" rx="15" fill="white" stroke="#ccdef7"/><circle cx="529" cy="101" r="16" fill="#1479ef"/><text x="524" y="107" fill="white" font-size="17">3</text><text x="517" y="143" font-weight="bold" font-size="17" fill="#123e73">APPLIANCES</text><text x="517" y="176" font-size="15" fill="#547294">Quantity + power</text><text x="517" y="202" font-size="15" fill="#547294">Hours / days / kWh</text><path d="M707 151h19m-7-7 7 7-7 7" fill="none" stroke="#4394f2" stroke-width="3"/><rect x="735" y="70" width="200" height="164" rx="15" fill="white" stroke="#ccdef7"/><circle cx="764" cy="101" r="16" fill="#1479ef"/><text x="759" y="107" fill="white" font-size="17">4</text><text x="752" y="143" font-weight="bold" font-size="17" fill="#123e73">ANALYSIS</text><text x="752" y="176" font-size="15" fill="#547294">Trends + charts</text><text x="752" y="202" font-size="15" fill="#547294">Compare months</text><path d="M942 151h19m-7-7 7 7-7 7" fill="none" stroke="#4394f2" stroke-width="3"/><rect x="970" y="70" width="200" height="164" rx="15" fill="white" stroke="#ccdef7"/><circle cx="999" cy="101" r="16" fill="#1479ef"/><text x="994" y="107" fill="white" font-size="17">5</text><text x="987" y="143" font-weight="bold" font-size="17" fill="#123e73">AI ADVICE</text><text x="987" y="176" font-size="15" fill="#547294">Ask + follow up</text><text x="987" y="202" font-size="15" fill="#547294">Save or export</text></g></svg>