<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">PowerTrack</title><desc id="desc">An illustrated electricity tracking and AI advice workflow. All displayed values are examples.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#082e60"/><stop offset="1" stop-color="#0b63cd"/></linearGradient></defs><rect width="1200" height="400" rx="24" fill="url(#bg)"/><g font-family="Arial, sans-serif"><rect x="42" y="40" width="175" height="30" rx="15" fill="#d7ebff"/><text x="60" y="61" font-size="13" font-weight="bold" fill="#0b407e">UNIVERSITY PROJECT</text><text x="46" y="145" fill="white" font-size="65" font-weight="bold">PowerTrack</text><text x="48" y="190" fill="#cee5ff" font-size="23">Understand your bills. Plan your savings.</text><text x="48" y="235" fill="#cee5ff" font-size="17">Monthly bills + appliance usage + household context</text><rect x="48" y="281" width="360" height="45" rx="12" fill="#238aff"/><text x="69" y="310" fill="white" font-size="18">Track  /  Compare  /  Ask AI</text><rect x="715" y="47" width="435" height="302" rx="22" fill="white"/><text x="744" y="83" fill="#153d6f" font-size="17" font-weight="bold">YOUR ENERGY STORY</text><text x="744" y="118" fill="#7890ab" font-size="13">ILLUSTRATIVE DATA</text><path d="M746 259H1117" stroke="#e4edf7" stroke-width="2"/><g fill="#238aff"><rect x="754" y="204" width="35" height="55" rx="5"/><rect x="812" y="174" width="35" height="85" rx="5"/><rect x="870" y="190" width="35" height="69" rx="5"/><rect x="928" y="146" width="35" height="113" rx="5"/><rect x="986" y="160" width="35" height="99" rx="5"/><rect x="1044" y="182" width="35" height="77" rx="5"/></g><path d="M770 184L829 154L887 170L945 126L1003 140L1061 162" fill="none" stroke="#16b594" stroke-width="4"/><rect x="744" y="281" width="372" height="40" rx="10" fill="#edf6ff"/><text x="762" y="307" fill="#145cad" font-size="16">Facts first. Practical AI guidance next.</text></g></svg>