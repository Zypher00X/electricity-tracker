<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">How an AI request uses your data</title><desc id="desc">Illustration, not a live AI response. A sample bill of 850 baht and computer estimate of 64 kWh are calculated by the backend before the model explains an action plan.</desc><rect width="1200" height="450" rx="22" fill="#edf5ff"/><g font-family="Arial, sans-serif"><text x="32" y="43" font-size="22" fill="#123e73" font-weight="bold">WHAT GOES INTO AN AI REQUEST?</text><text x="32" y="72" font-size="15" fill="#5b7391">Illustration with example data. This is not a screenshot or an actual model answer.</text><rect x="30" y="100" width="347" height="250" rx="16" fill="white" stroke="#cbdff7"/><text x="50" y="137" fill="#145fae" font-size="19" font-weight="bold">1. ACCOUNT DATA</text><text x="50" y="177" fill="#244b78" font-size="17">Selected month only</text><text x="50" y="213" fill="#244b78" font-size="17">Bill: 100 kWh / 850 THB</text><text x="50" y="249" fill="#244b78" font-size="17">Computers: estimated 64 kWh</text><text x="50" y="285" fill="#244b78" font-size="17">Budget: 1,000 THB</text><rect x="426" y="100" width="347" height="250" rx="16" fill="#0c5fbe"/><text x="446" y="137" fill="white" font-size="19" font-weight="bold">2. BACKEND CHECKS</text><text x="446" y="177" fill="#e1eeff" font-size="17">Ownership + scope + quota</text><text x="446" y="213" fill="#e1eeff" font-size="17">Compute facts and scenarios</text><text x="446" y="249" fill="#e1eeff" font-size="17">Mark missing information</text><text x="446" y="285" fill="#e1eeff" font-size="17">Match cache to context</text><rect x="822" y="100" width="347" height="250" rx="16" fill="white" stroke="#cbdff7"/><text x="842" y="137" fill="#145fae" font-size="19" font-weight="bold">3. PRACTICAL GUIDANCE</text><text x="842" y="177" fill="#244b78" font-size="17">Explain the known facts</text><text x="842" y="213" fill="#244b78" font-size="17">State assumptions clearly</text><text x="842" y="249" fill="#244b78" font-size="17">Suggest actions to try</text><text x="842" y="285" fill="#244b78" font-size="17">Ask for essential missing data</text><path d="M385 223h30m-8-8 8 8-8 8M781 223h30m-8-8 8 8-8 8" stroke="#238aff" stroke-width="3" fill="none"/><rect x="30" y="374" width="1139" height="45" rx="10" fill="#dcecff"/><text x="50" y="402" fill="#234e7f" font-size="16">Estimates are not guaranteed savings. Meter totals and appliance estimates describe different kinds of evidence.</text></g></svg>