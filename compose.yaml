name: electricity_tracker

services:

  # =========================================
  # FASTAPI BACKEND
  # =========================================

  backend:
    build:
      context: ./Back__end

    container_name: electricity_tracker_backend

    ports:
      - "0.0.0.0:8000:8000"

    env_file:
      - .env

    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ADVICE_PROVIDER_RPM: ${ADVICE_PROVIDER_RPM:-10}
      ADVICE_PROVIDER_DAILY_LIMIT: ${ADVICE_PROVIDER_DAILY_LIMIT:-100}

    volumes:
      - ./Back__end:/app
      - ./Front__end:/frontend

    command:
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - electricity_network


  # =========================================
  # REDIS
  # =========================================

  redis:
    image: redis:7-alpine

    container_name: electricity_tracker_redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command: >
      sh -c 'exec redis-server
      --appendonly yes
      --requirepass "$$REDIS_PASSWORD"'

    expose:
      - "6379"

    volumes:
      - electricity_redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]

      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - electricity_network


# =========================================
# VOLUMES
# =========================================

volumes:

  electricity_redis_data:
    name: electricity_tracker_redis_data


# =========================================
# NETWORK
# =========================================

networks:

  electricity_network:
    name: electricity_tracker_network

    driver: bridge
